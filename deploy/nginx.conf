# نمونه پیکربندی Nginx — reverse proxy جلوی Gunicorn
# نصب:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tmdz
#   sudo ln -s /etc/nginx/sites-available/tmdz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# سپس با certbot گواهی SSL بگیرید:
#   sudo certbot --nginx -d tmdz.ir -d www.tmdz.ir

server {
    listen 80;
    server_name tmdz.ir www.tmdz.ir;

    # هدایت به HTTPS (پس از دریافت گواهی، certbot این را خودکار اضافه می‌کند)
    # return 301 https://$host$request_uri;

    client_max_body_size 60M;   # هماهنگ با MAX_CONTENT_LENGTH اپ (۵۰MB) + سرریز

    # فشرده‌سازی پاسخ‌های متنی — حجم انتقال را برای HTML/CSS/JS/JSON به‌طور
    # قابل توجهی کم می‌کند، مخصوصاً روی موبایل/اینترنت کند اعضا
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml font/ttf font/otf;

    # فایل‌های static مستقیم توسط nginx سرو می‌شوند (سریع‌تر)
    location /static/ {
        alias /home/admin/tmdz-app/static/;
        expires 7d;
        access_log off;
    }

    # مهم: پوشه‌های حساس نباید مستقیم از static سرو شوند
    # (اپ هم آن‌ها را مسدود می‌کند، این یک لایه دفاعی اضافه است)
    location ~ ^/static/uploads/(requests|payments|member_docs|marketplace)/ {
        deny all;
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
