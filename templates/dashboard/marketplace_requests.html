{% extends "dashboard/layout.html" %}
{% block content %}
<div class="pg-hdr">
  <h1 class="pg-title">درخواست‌های خرید</h1>
</div>
<div id="wrap" class="stagger"></div>
{% endblock %}
{% block scripts %}
<script>
var STATUS_LBL = { new:'جدید', negotiating:'در حال مذاکره', contacted:'تماس گرفته شد', deal_done:'معامله انجام شد', cancelled:'منتفی شد' };
var STATUS_CLS = { new:'b-info', negotiating:'b-warn', contacted:'b-warn', deal_done:'b-ok', cancelled:'b-off' };
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&lt;','<':'&lt;','>':'&gt;'}[c];}); }
function timeAgo(iso){
  var d=new Date(iso), diff=(Date.now()-d.getTime())/1000;
  if(diff<60)return 'همین الان';
  if(diff<3600)return Math.floor(diff/60)+' دقیقه پیش';
  if(diff<86400)return Math.floor(diff/3600)+' ساعت پیش';
  return Math.floor(diff/86400)+' روز پیش';
}

function load(){
  fetch('/api/marketplace/my-requests').then(function(r){return r.json();}).then(function(d){
    var items = d.requests || [];
    var wrap = document.getElementById('wrap');
    if(!items.length){
      wrap.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>هنوز درخواست خریدی برای آگهی‌های شما ثبت نشده</div>';
      return;
    }
    wrap.innerHTML = items.map(function(r){
      return '<div class="card card-p" style="margin-bottom:12px">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">'+
          '<div>'+
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'+
              '<b>'+esc(r.buyer_name)+'</b>'+
              '<span class="badge '+(STATUS_CLS[r.status]||'b-off')+'">'+(STATUS_LBL[r.status]||r.status)+'</span>'+
            '</div>'+
            '<div style="font-size:12px;color:var(--muted)">آگهی: '+esc(r.listing_title)+' ('+r.listing_code+')</div>'+
            '<div style="font-size:13px;margin-top:6px" dir="ltr">📱 '+esc(r.buyer_phone)+'</div>'+
            (r.message ? '<div style="font-size:13px;margin-top:6px;color:var(--text2)">'+esc(r.message)+'</div>' : '')+
            '<div style="font-size:11px;color:var(--muted2);margin-top:6px">'+timeAgo(r.created_at)+'</div>'+
          '</div>'+
          '<select class="input" style="width:auto;font-size:12px" onchange="updateStatus('+r.id+',this.value)">'+
            Object.keys(STATUS_LBL).map(function(k){
              return '<option value="'+k+'" '+(k===r.status?'selected':'')+'>'+STATUS_LBL[k]+'</option>';
            }).join('')+
          '</select>'+
        '</div>'+
      '</div>';
    }).join('');
  });
}

function updateStatus(id, status){
  fetch('/api/marketplace/requests/'+id+'/status', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status:status})})
    .then(function(r){ if(r.ok){ toast('وضعیت به‌روزرسانی شد'); } else { toast('خطا', 'warn'); load(); } });
}

load();
</script>
{% endblock %}
