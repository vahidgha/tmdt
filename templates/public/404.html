<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>صفحه پیدا نشد (۴۰۴) — {{ site_title }}</title>
  <meta name="description" content="صفحه موردنظر یافت نشد. به صفحه اصلی {{ site_title }} یا بازار خرید و فروش دفترچه‌ها بازگردید.">
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif; direction: rtl;
      background: linear-gradient(160deg, #101828 0%, #1A2740 60%, #15213A 100%);
      color: #F5F1E6; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; text-align: center;
    }
    .code { font-size: clamp(56px,12vw,110px); font-weight: 900; color: #B8925A; line-height: 1; }
    h1 { font-size: clamp(18px,3vw,26px); font-weight: 800; margin: 10px 0 8px; }
    p { color: rgba(230,228,220,.7); font-size: 14px; margin-bottom: 26px; }
    .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      padding: 11px 22px; border-radius: 10px; font-size: 13.5px; font-weight: 700;
      transition: transform .2s ease;
    }
    a.btn:hover { transform: translateY(-2px); }
    .btn-solid { background: #B8925A; color: #1A1200; }
    .btn-ghost { background: rgba(255,255,255,.08); color: #F5F1E6; border: 1px solid rgba(255,255,255,.18); }
  </style>
</head>
<body>
  <div>
    <div class="code">۴۰۴</div>
    <h1>این صفحه پیدا نشد</h1>
    <p>ممکن است آدرس اشتباه باشد یا صفحه جابه‌جا شده باشد.</p>
    <div class="links">
      <a href="/" class="btn btn-solid">بازگشت به صفحه اصلی</a>
      <a href="/marketplace" class="btn btn-ghost">بازار خرید و فروش</a>
    </div>
  </div>
</body>
</html>
