{% extends "base.html" %}
{% block title %}تغییر رمز عبور{% endblock %}
{% block body %}
<div class="login-wrap">
  <canvas id="loginBg"></canvas>
  <div class="login-card">
    <div class="login-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1A2035" stroke-width="2.3" stroke-linecap="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1 class="login-title">تغییر رمز عبور</h1>
    <p class="login-sub">رمز عبور جدید خود را وارد کنید</p>

    {% if error %}
    <div class="alert alert-bad">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>رمز عبور جدید</label>
        <input name="password" type="password" class="input" placeholder="حداقل ۶ کاراکتر" autofocus autocomplete="new-password">
      </div>
      <div class="field">
        <label>تکرار رمز عبور</label>
        <input name="password2" type="password" class="input" placeholder="تکرار رمز عبور" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-navy btn-block" style="margin-top:6px">ذخیره رمز عبور</button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){var c=document.getElementById('loginBg');if(!c)return;var x=c.getContext('2d'),W,H,t=0;function r(){W=c.width=innerWidth;H=c.height=innerHeight;}window.addEventListener('resize',r);r();(function d(){x.clearRect(0,0,W,H);var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#020712');g.addColorStop(1,'#0A1522');x.fillStyle=g;x.fillRect(0,0,W,H);t++;requestAnimationFrame(d);})();})();
</script>
{% endblock %}
