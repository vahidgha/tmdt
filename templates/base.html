<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مدیریت اعضا">
  <meta name="theme-color" content="#0E1B32">
  <meta name="description" content="سامانه مدیریت اعضا، دفترچه‌های مالکیت و امور مالی">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}سامانه مدیریت اعضا و امور مالی{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json">
  {% if site_logo %}
  <link rel="apple-touch-icon" href="/uploads/{{ site_logo }}">
  <link rel="icon" type="image/png" href="/uploads/{{ site_logo }}">
  {% else %}
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css?v={{ app_version }}">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script src="/static/js/csrf.js?v={{ app_version }}"></script>
  <script src="/static/js/app.js?v={{ app_version }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/static/sw.js', {scope: '/static/'}).catch(function(){});
  });
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
